<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#1c1922" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e9ebee" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Peek</title>
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="wordmark" aria-label="Peek home">peek</a>
    <button class="icon-btn" id="refresh-all" title="Refresh everything now" aria-label="Refresh everything now">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>

  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="feed" aria-label="Feed"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 15l4.5-4.5 4 4 2.5-2.5L20 17"/></svg><span>Feed</span></a>
    <a href="#/reels" data-tab="reels" aria-label="Reels"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg><span>Reels</span></a>
    <a href="#/saved" data-tab="saved" aria-label="Saved"><svg viewBox="0 0 24 24"><path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4.5L5.5 20V5a1 1 0 0 1 1-1z"/></svg><span>Saved</span></a>
    <a href="#/search" data-tab="search" aria-label="Look up"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>Look up</span></a>
    <a href="#/following" data-tab="following" aria-label="Following"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5M16 6.5a3 3 0 0 1 0 5.5M18 14.8c1.5.6 2.5 2 3 4.2"/></svg><span>Following</span></a>
  </nav>

  <div id="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" defer></script>

</html>
